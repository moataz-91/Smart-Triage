<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart AI Triage - تسجيل الدخول</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: white;
        }

        /* شبكة خلفية جمالية تعطي طابع تكنولوجي طبي */
        .bg-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(rgba(56, 189, 248, 0.1) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
        }

        .login-container {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid #38bdf8;
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4), 0 0 20px rgba(56, 189, 248, 0.15);
            z-index: 2;
            transition: transform 0.3s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 3.5rem;
            color: #38bdf8;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .login-header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 0.95rem;
        }

        /* أزرار التبويب بين الطبيب والمريض */
        .role-tabs {
            display: flex;
            background: #0f172a;
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 25px;
            border: 1px solid rgba(56, 189, 248, 0.3);
        }

        .role-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            color: #94a3b8;
        }

        .role-tab.active {
            background: #38bdf8;
            color: #0f172a;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #e2e8f0;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 40px 12px 15px;
            background: #0f172a;
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 10px;
            color: white;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        .form-icon {
            position: absolute;
            right: 15px;
            top: 40px;
            color: #38bdf8;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 5px 15px rgba(2, 132, 199, 0.4);
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 189, 248, 0.6);
        }

        .footer-text {
            text-align: center;
            margin-top: 25px;
            font-size: 0.85rem;
            color: #64748b;
        }

        /* رسالة التنبيه */
        .alert-box {
            display: none;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            font-size: 0.9rem;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>

    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon"><i class="fa-solid fa-hospital-user"></i></div>
            <h1>Smart AI Triage</h1>
            <p>نظام الفرز الإكلينيكي الذكي ودعم القرار</p>
        </div>

        <div class="role-tabs">
            <div class="role-tab active" id="tab-doctor" onclick="switchRole('doctor')">
                <i class="fa-solid fa-user-doctor"></i> الطاقم الطبي
            </div>
            <div class="role-tab" id="tab-patient" onclick="switchRole('patient')">
                <i class="fa-solid fa-wheelchair"></i> دخول المريض
            </div>
        </div>

        <div class="alert-box" id="error-alert"></div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label id="label-username">البريد الإلكتروني أو كود الطبيب (ID)</label>
                <i class="fa-solid fa-id-card form-icon"></i>
                <input type="text" id="username" class="form-control" placeholder="مثال: dr.ahmed أو 1024" required>
            </div>

            <div class="form-group" id="password-group">
                <label>كلمة المرور السرية</label>
                <i class="fa-solid fa-lock form-icon"></i>
                <input type="password" id="password" class="form-control" placeholder="••••••••">
            </div>

            <button type="submit" class="btn-login" id="loginBtn">
                <span>تسجيل الدخول الآمن</span>
                <i class="fa-solid fa-arrow-left"></i>
            </button>
        </form>

        <div class="footer-text">
            جميع الحقوق محفوظة © 2026 | المنظومة الطبية الذكية
        </div>
    </div>

    <script>
        let currentRole = 'doctor';

        // دالة التبديل بين الأطباء والمرضى
        function switchRole(role) {
            currentRole = role;
            const tabDoctor = document.getElementById('tab-doctor');
            const tabPatient = document.getElementById('tab-patient');
            const passGroup = document.getElementById('password-group');
            const labelUser = document.getElementById('label-username');
            const usernameInput = document.getElementById('username');
            const alertBox = document.getElementById('error-alert');

            alertBox.style.display = 'none';

            if (role === 'doctor') {
                tabDoctor.classList.add('active');
                tabPatient.classList.remove('active');
                passGroup.style.display = 'block';
                labelUser.innerText = 'البريد الإلكتروني أو كود الطبيب (ID)';
                usernameInput.placeholder = 'مثال: dr.ahmed أو 1024';
                document.getElementById('password').required = true;
            } else {
                tabPatient.classList.add('active');
                tabDoctor.classList.remove('active');
                // المريض مش محتاج باسورد للدخول السريع للفرز
                passGroup.style.display = 'none';
                labelUser.innerText = 'رقم الهاتف أو الكارنيه الطبي للمريض';
                usernameInput.placeholder = 'ادخل رقم هاتفك لبدء الفرز...';
                document.getElementById('password').required = false;
            }
        }

        // دالة معالجة الدخول والتحويل للشاشة المناسبة
        function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('loginBtn');
            const alertBox = document.getElementById('error-alert');
            const username = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;

            // تغيير شكل الزرار لوضع التحميل
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>جاري التحقق والمصادقة...</span>';
            btn.style.opacity = '0.7';
            btn.disabled = true;

            setTimeout(() => {
                if (currentRole === 'doctor') {
                    // يمكنك تغيير الكلمة السرية الافتراضية هنا لو حبيت (حالياً أي باسورد هيكمل للتسهيل أو admin123)
                    if (pass === 'admin' || pass === '123456' || pass.length >= 3) {
                        window.location.href = '/doctor.html';
                    } else {
                        showError('كلمة المرور غير صحيحة! جرب 123456 أو admin');
                        resetBtn();
                    }
                } else {
                    // دخول المريض يحوله فوراً لشاشة المريض
                    window.location.href = '/patient.html';
                }
            }, 1200); // محاكاة بسيطة للتحميل لتعطي انطباع احترافي
        }

        function showError(msg) {
            const alertBox = document.getElementById('error-alert');
            alertBox.innerText = msg;
            alertBox.style.display = 'block';
        }

        function resetBtn() {
            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<span>تسجيل الدخول الآمن</span> <i class="fa-solid fa-arrow-left"></i>';
            btn.style.opacity = '1';
            btn.disabled = false;
        }
    </script>
</body>
</html>
